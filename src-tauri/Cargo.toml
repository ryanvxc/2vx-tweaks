[package]
name = "twovx-tweaks"
version = "0.2.0"
description = "2VX Tweaks - Windows PC optimisation suite"
authors = ["2VX"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "twovx_tweaks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
getrandom = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62.2", features = ["ApplicationModel", "Foundation", "Foundation_Collections", "Management_Deployment", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-collections = "0.3.2"
windows-registry = "0.100.0"
windows-result = "0.100.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
